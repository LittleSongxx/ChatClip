services:
  chatclip:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CHATCLIP_INSTALL_PROFILE: ${CHATCLIP_INSTALL_PROFILE:-cpu}
    ports:
      - "${CHATCLIP_BIND_ADDRESS:-127.0.0.1}:${CHATCLIP_PORT:-5180}:5180"
    environment:
      CHATCLIP_HOST: 0.0.0.0
      CHATCLIP_PORT: 5180
      CHATCLIP_DATA_ROOT: /app/data
      CHATCLIP_BIND_ADDRESS: ${CHATCLIP_BIND_ADDRESS:-127.0.0.1}
      CHATCLIP_ACCESS_TOKEN: ${CHATCLIP_ACCESS_TOKEN:-}
      # Uvicorn must listen across the container network. The published bind
      # address above is checked separately and refuses unsafe remote exposure.
      CHATCLIP_ALLOW_UNAUTHENTICATED_REMOTE: "true"
      CHATCLIP_MAX_WORKERS: ${CHATCLIP_MAX_WORKERS:-1}
      CHATCLIP_MAX_UPLOAD_BYTES: ${CHATCLIP_MAX_UPLOAD_BYTES:-8589934592}
      CHATCLIP_MAX_STORAGE_BYTES: ${CHATCLIP_MAX_STORAGE_BYTES:-53687091200}
      CHATCLIP_RETENTION_DAYS: ${CHATCLIP_RETENTION_DAYS:-0}
      CHATCLIP_ALLOW_PRIVATE_MODEL_ENDPOINTS: ${CHATCLIP_ALLOW_PRIVATE_MODEL_ENDPOINTS:-false}
      CHATCLIP_ACTIVE_SPEAKER_MODE: ${CHATCLIP_ACTIVE_SPEAKER_MODE:-primary}
      CHATCLIP_TALKNET_DEVICE: auto
      # 推荐模型主线：视觉 qwen3-vl-max（百炼）、规划 deepseek-flash（DeepSeek）、
      # Agent qwen3.8-max（百炼）。留空密钥时保持未配置状态，可在页面设置中填写。
      VISION_PROVIDER: ${VISION_PROVIDER:-bailian}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl-max}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-qwen3.8-max}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
    volumes:
      - chatclip-data:/app/data
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  chatclip-data:
